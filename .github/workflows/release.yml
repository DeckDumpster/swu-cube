name: Release

# A v* tag builds both targets and attaches the binaries and a SHA256SUMS to the release. It ends
# there: the pin lands through the queue, from scripts/pin-release.sh (see the README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p swu-cube-check --target ${{ matrix.target }}
      - name: Name the binary for its target
        run: cp target/${{ matrix.target }}/release/swu-cube-check swu-cube-check-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: swu-cube-check-${{ matrix.target }}
          path: swu-cube-check-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        run: |
          cd dist
          sha256sum swu-cube-check-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" swu-cube-check-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
