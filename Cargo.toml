[workspace]
resolver = "2"
members = ["crates/swu-cube-check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ryan Gantt"]
repository = "https://github.com/DeckDumpster/swu-cube"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
sha2 = "0.10"
getrandom = "0.3"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
